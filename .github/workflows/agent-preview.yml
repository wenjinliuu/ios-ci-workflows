name: Reusable Agent Preview

on:
  workflow_call:
    inputs:
      workdir:
        type: string
        required: true
      project:
        type: string
        required: true
      scheme:
        type: string
        required: true
      bundle_id:
        type: string
        required: true
      sync_command:
        type: string
        required: true
      generate_command:
        type: string
        required: true
      simulator_name:
        type: string
        default: iPhone 17 Pro
      ios_runtime:
        type: string
        default: '26'
      live_preview:
        type: boolean
        default: false
      preview_minutes:
        type: number
        default: 12
      public_preview_url:
        type: string
        default: ''
      ci_revision:
        type: string
        required: true
      ci_repository:
        type: string
        default: wenjinliuu/ios-ci-workflows
      test_plan:
        type: string
        default: ''
      record_snapshots:
        type: boolean
        default: false
      accessibility_audit:
        type: string
        default: warn
      accessibility_test_pattern:
        type: string
        default: '(?i)accessibility'
    secrets:
      AGENT_PREVIEW_PASSWORD:
        required: false
      AGENT_PREVIEW_TUNNEL_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 65
    defaults:
      run:
        working-directory: ${{ inputs.workdir }}
        shell: bash
    env:
      PROJECT: ${{ inputs.project }}
      SCHEME: ${{ inputs.scheme }}
      BUNDLE_ID: ${{ inputs.bundle_id }}
      REQUESTED_DEVICE: ${{ inputs.simulator_name }}
      REQUESTED_RUNTIME: ${{ inputs.ios_runtime }}
      DERIVED_DATA: ${{ github.workspace }}/.agent-preview-derived-data
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch shared CI scripts
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.ci_repository }}
          ref: ${{ inputs.ci_revision }}
          path: .ci-workflows
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'
      - name: Check toolchain and install project generator
        run: |
          set -euo pipefail
          test "${{ inputs.accessibility_audit }}" = warn || test "${{ inputs.accessibility_audit }}" = fail
          xcodebuild -version
          if [[ "${{ inputs.generate_command }}" == *xcodegen* ]]; then brew install xcodegen; fi
          curl -fLsS https://github.com/cpisciotta/xcbeautify/releases/download/3.2.1/xcbeautify-3.2.1-arm64-apple-macosx.zip \
            -o "$RUNNER_TEMP/xcbeautify.zip"
          echo "ed32972e41bc3aa19588f8b0f4a0209ef70c663ad60bbf4ad84a2de73355d637  $RUNNER_TEMP/xcbeautify.zip" | shasum -a 256 -c -
          unzip -oq "$RUNNER_TEMP/xcbeautify.zip" -d "$RUNNER_TEMP/xcbeautify"
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.agent-preview-derived-data/SourcePackages
          key: swift-packages-${{ runner.os }}-xcode26.6-${{ hashFiles('**/Package.resolved', '**/project.yml') }}
          restore-keys: swift-packages-${{ runner.os }}-xcode26.6-
      - name: Sync icon and generate project
        env:
          SYNC_COMMAND: ${{ inputs.sync_command }}
          GENERATE_COMMAND: ${{ inputs.generate_command }}
        run: |
          set -euo pipefail
          bash -e -c "$SYNC_COMMAND"
          bash -e -c "$GENERATE_COMMAND"
      - name: Select an installed iOS Simulator
        id: sim
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, sys
          items=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','--json']))['devices']
          found=[]
          runtime_of={}
          for runtime, devices in items.items():
              if 'iOS' not in runtime or os.environ['REQUESTED_RUNTIME'] not in runtime: continue
              for d in devices:
                  if d['name'].startswith('iPhone'):
                      found.append((runtime,d))
                      runtime_of[d['udid']]=runtime.rsplit('.',1)[-1].replace('iOS-','iOS ').replace('-','.')
          if not found: sys.exit('Requested iOS runtime not installed: '+os.environ['REQUESTED_RUNTIME'])
          exact=[d for _,d in found if d['name']==os.environ['REQUESTED_DEVICE']]
          device=exact[0] if exact else sorted((d for _,d in found),key=lambda x:x['name'])[-1]
          if not exact: print('::warning::Simulator '+os.environ['REQUESTED_DEVICE']+' unavailable; using '+device['name']+' (snapshot references may not match)')
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('udid='+device['udid']+'\nname='+device['name']+'\nruntime='+runtime_of[device['udid']]+'\n')
          print('Selected '+device['name']+' ('+device['udid']+')')
          PY
      - name: Boot selected Simulator
        run: |
          xcrun simctl boot "${{ steps.sim.outputs.udid }}"
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b
      - name: Build and run tests without signing
        id: test
        env:
          NSUnbufferedIO: YES
          TEST_PLAN: ${{ inputs.test_plan }}
          RECORD_SNAPSHOTS: ${{ inputs.record_snapshots }}
        run: |
          set -uo pipefail
          mkdir -p build/agent-preview
          args=()
          if [ -n "$TEST_PLAN" ]; then args+=(-testPlan "$TEST_PLAN"); fi
          # xcodebuild hands TEST_RUNNER_* variables to the test process without the prefix.
          if [ "$RECORD_SNAPSHOTS" = true ]; then export TEST_RUNNER_SNAPSHOT_TESTING_RECORD=failed; fi
          xcodebuild test -project "$PROJECT" -scheme "$SCHEME" -configuration Debug ${args[@]+"${args[@]}"} \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$DERIVED_DATA" -resultBundlePath build/agent-preview/Test.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/agent-preview/xcodebuild.log \
            | "$RUNNER_TEMP/xcbeautify/xcbeautify" --renderer github-actions
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          APP="$DERIVED_DATA/Build/Products/Debug-iphonesimulator/${SCHEME}.app"
          if [ -d "$APP" ]; then echo built=true >> "$GITHUB_OUTPUT"; else echo built=false >> "$GITHUB_OUTPUT"; fi
      - name: Install, launch and capture evidence
        if: ${{ !cancelled() && steps.test.outputs.built == 'true' }}
        run: |
          set -euo pipefail
          APP="$DERIVED_DATA/Build/Products/Debug-iphonesimulator/${SCHEME}.app"
          test -f "$APP/Assets.car"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = "$BUNDLE_ID"
          xcrun simctl install "${{ steps.sim.outputs.udid }}" "$APP"
          xcrun simctl launch "${{ steps.sim.outputs.udid }}" "$BUNDLE_ID"
          sleep 4
          xcrun simctl io "${{ steps.sim.outputs.udid }}" screenshot build/agent-preview/launch.png
          xcrun simctl spawn "${{ steps.sim.outputs.udid }}" log show --last 2m --style compact \
            --predicate "process == '${SCHEME}'" > build/agent-preview/app.log 2>&1 || true
      - name: Capture accessibility tree with XcodeBuildMCP
        if: ${{ !cancelled() && steps.test.outputs.built == 'true' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            npx --yes xcodebuildmcp@2.7.0 ui-automation snapshot-ui \
              --simulator-id "${{ steps.sim.outputs.udid }}" --output json \
              > build/agent-preview/ui-tree.json || true
            if python3 - <<'PY'
          import json
          try:
              with open('build/agent-preview/ui-tree.json') as artifact:
                  snapshot = json.load(artifact)
              assert not snapshot.get('didError')
              assert snapshot.get('data', {}).get('summary', {}).get('status') != 'FAILED'
          except (ValueError, OSError, AssertionError):
              raise SystemExit(1)
          PY
            then
              echo 'Accessibility hierarchy captured.'
              exit 0
            fi
            if grep -q 'No translation object returned for simulator' build/agent-preview/ui-tree.json; then
              # AXe can lose its host bridge on iOS 26; launchd restarts this process.
              pkill -9 -f '/usr/libexec/CoreSimulatorBridge' || true
            fi
            sleep 5
          done
          echo '::warning::XcodeBuildMCP could not capture the Simulator accessibility hierarchy; inspect ui-tree.json in the artifact.'
          exit 1
      - name: Collect recorded snapshot references
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          mkdir -p "$RUNNER_TEMP/recorded-snapshots"
          git ls-files -z --others --modified --exclude-standard -- ':(glob)**/__Snapshots__/**' ':!.ci-workflows' \
            | while IFS= read -r -d '' file; do
                mkdir -p "$RUNNER_TEMP/recorded-snapshots/$(dirname "$file")"
                cp "$file" "$RUNNER_TEMP/recorded-snapshots/$file"
                printf '%s\n' "$file"
              done > "$RUNNER_TEMP/recorded-snapshots.txt"
          echo "Recorded snapshot files: $(wc -l < "$RUNNER_TEMP/recorded-snapshots.txt")"
      - name: Write test report
        id: report
        if: ${{ !cancelled() }}
        env:
          XCRESULT: build/agent-preview/Test.xcresult
          REPORT_DIR: build/agent-preview/report
          BUILD_LOG: build/agent-preview/xcodebuild.log
          BUILT: ${{ steps.test.outputs.built }}
          DEVICE: ${{ steps.sim.outputs.name }} (${{ steps.sim.outputs.runtime }})
          TEST_PLAN: ${{ inputs.test_plan }}
          RECORD_SNAPSHOTS: ${{ inputs.record_snapshots }}
          RECORDED_LIST: ${{ runner.temp }}/recorded-snapshots.txt
          ACCESSIBILITY_MODE: ${{ inputs.accessibility_audit }}
          ACCESSIBILITY_PATTERN: ${{ inputs.accessibility_test_pattern }}
        run: python3 "$GITHUB_WORKSPACE/.ci-workflows/scripts/xcresult-report.py"
      - name: Run authenticated browser session
        if: ${{ !cancelled() && steps.test.outputs.built == 'true' && inputs.live_preview && github.event_name == 'workflow_dispatch' }}
        env:
          PREVIEW_PASSWORD: ${{ secrets.AGENT_PREVIEW_PASSWORD }}
          PREVIEW_MINS: ${{ inputs.preview_minutes }}
          PREVIEW_NAMED_URL: ${{ inputs.public_preview_url }}
          PREVIEW_TUNNEL_TOKEN: ${{ secrets.AGENT_PREVIEW_TUNNEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PREVIEW_PASSWORD" || { echo 'Set AGENT_PREVIEW_PASSWORD in this App repository before enabling live preview'; exit 1; }
          test "$PREVIEW_MINS" -ge 1 && test "$PREVIEW_MINS" -le 20
          uname -m | grep -q arm64
          npm install --prefix "$RUNNER_TEMP/agent-preview-tools" --no-save --no-audit --no-fund \
            serve-sim@0.1.46 http-proxy@1.18.1 ws@8.21.0
          SIM_TOOLS="$RUNNER_TEMP/agent-preview-tools/node_modules"
          "$SIM_TOOLS/.bin/serve-sim" "${{ steps.sim.outputs.name }}" --host 127.0.0.1 --port 3200 \
            > build/agent-preview/serve-sim.log 2>&1 &
          echo $! > build/agent-preview/serve-sim.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:3200/ >/dev/null && break || sleep 2; done
          curl -fsS http://127.0.0.1:3200/ >/dev/null
          cp "$GITHUB_WORKSPACE/.ci-workflows/scripts/preview-proxy.cjs" "$RUNNER_TEMP/preview-proxy.cjs"
          NODE_PATH="$SIM_TOOLS" PREVIEW_PASSWORD="$PREVIEW_PASSWORD" \
            SIM_UDID="${{ steps.sim.outputs.udid }}" APP_SCHEME="$SCHEME" \
            SERVE_SIM_BIN="$SIM_TOOLS/.bin/serve-sim" node "$RUNNER_TEMP/preview-proxy.cjs" \
            > build/agent-preview/proxy.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3210/ >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3210/ >/dev/null
          python3 - <<'PY'
          import os, time, urllib.error, urllib.parse, urllib.request
          base = 'http://127.0.0.1:3210'
          data = urllib.parse.urlencode({'password': os.environ['PREVIEW_PASSWORD']}).encode()
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, msg, headers, newurl):
                  return None
          opener = urllib.request.build_opener(NoRedirect)
          try:
              opener.open(urllib.request.Request(base + '/login', data=data), timeout=10)
          except urllib.error.HTTPError as response:
              assert response.code == 303, response.code
              cookie = response.headers['Set-Cookie'].split(';')[0]
          assert cookie.startswith('preview_session=')
          def get(path):
              return urllib.request.urlopen(urllib.request.Request(base + path, headers={'Cookie': cookie}), timeout=15)
          with get('/') as response:
              assert b'iOS Agent Preview' in response.read()
          try:
              get('/exec-ws')
              raise AssertionError('Shell-capable endpoint is public')
          except urllib.error.HTTPError as response:
              assert response.code == 404, response.code
          for attempt in range(3):
              try:
                  with get('/helper/stream.mjpeg?raw=1') as response:
                      assert response.status == 200
                      # serve-sim prefixes even raw JPEG frames with a MIME frame header.
                      assert b'\xff\xd8' in response.read(4096), 'No JPEG frame received'
                  break
              except (OSError, AssertionError):
                  if attempt == 2: raise
                  time.sleep(3)
          print('Preview authentication, shell isolation and simulator frame verified')
          PY
          curl -fLsS https://github.com/cloudflare/cloudflared/releases/download/2026.9.3/cloudflared-darwin-arm64.tgz \
            -o "$RUNNER_TEMP/cloudflared.tgz"
          echo '587c2cfb1c230fe36c7fa7727da78be459dae028cabe8c001291999350f07095  '"$RUNNER_TEMP/cloudflared.tgz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/cloudflared.tgz" -C "$RUNNER_TEMP" cloudflared
          PUBLIC_READY=false
          if [ -n "$PREVIEW_NAMED_URL" ] || [ -n "$PREVIEW_TUNNEL_TOKEN" ]; then
            test -n "$PREVIEW_NAMED_URL" && test -n "$PREVIEW_TUNNEL_TOKEN" || {
              echo 'Set both AGENT_PREVIEW_URL variable and AGENT_PREVIEW_TUNNEL_TOKEN secret for a named tunnel'; exit 1;
            }
            URL="$PREVIEW_NAMED_URL"
            printf '%s' "$PREVIEW_TUNNEL_TOKEN" > "$RUNNER_TEMP/agent-preview-tunnel-token"
            chmod 600 "$RUNNER_TEMP/agent-preview-tunnel-token"
            "$RUNNER_TEMP/cloudflared" tunnel --no-autoupdate run --token-file "$RUNNER_TEMP/agent-preview-tunnel-token" \
              > build/agent-preview/tunnel.log 2>&1 &
            for attempt in {1..36}; do
              if PREVIEW_URL="$URL" NODE_PATH="$SIM_TOOLS" \
                node "$GITHUB_WORKSPACE/.ci-workflows/scripts/check-public-preview.cjs"; then
                PUBLIC_READY=true
                break
              fi
              sleep 5
            done
          else
            for tunnel_attempt in 1 2 3 4; do
              "$RUNNER_TEMP/cloudflared" tunnel --no-autoupdate --url http://127.0.0.1:3210 \
                > build/agent-preview/tunnel.log 2>&1 &
              TUNNEL_PID=$!
              URL=""
              for i in {1..40}; do
                URL=$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' build/agent-preview/tunnel.log | head -1 || true)
                if [ -n "$URL" ]; then break; fi
                sleep 2
              done
              if [ -n "$URL" ]; then
                for attempt in {1..12}; do
                  if PREVIEW_URL="$URL" NODE_PATH="$SIM_TOOLS" \
                    node "$GITHUB_WORKSPACE/.ci-workflows/scripts/check-public-preview.cjs"; then
                    PUBLIC_READY=true
                    break
                  fi
                  sleep 5
                done
              fi
              if [ "$PUBLIC_READY" = true ]; then break; fi
              cp build/agent-preview/tunnel.log "build/agent-preview/tunnel-attempt-${tunnel_attempt}.log"
              kill "$TUNNEL_PID" || true
              wait "$TUNNEL_PID" || true
            done
          fi
          test "$PUBLIC_READY" = true
          echo "### Authenticated Agent Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "Open: $URL (password: repository secret AGENT_PREVIEW_PASSWORD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Expires when this job ends, within $PREVIEW_MINS minutes." >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Authenticated Agent Preview::Open $URL while this job is running; use the repository preview password."
          sleep "$((PREVIEW_MINS*60))"
      - name: Upload screenshot, UI tree, test result and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-preview-${{ github.run_number }}
          path: ${{ inputs.workdir }}/build/agent-preview
          if-no-files-found: warn
          retention-days: 7
      - name: Upload XCTest result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-preview-xcresult-${{ github.run_number }}
          path: ${{ inputs.workdir }}/build/agent-preview/Test.xcresult
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload recorded snapshot references
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: recorded-snapshots-${{ github.run_number }}
          path: ${{ runner.temp }}/recorded-snapshots
          if-no-files-found: ignore
          retention-days: 14
      - name: Apply pass/fail rules
        if: ${{ !cancelled() }}
        env:
          BUILT: ${{ steps.test.outputs.built }}
          EXIT_CODE: ${{ steps.test.outputs.exit_code }}
          TEST_FAILURES: ${{ steps.report.outputs.test_failures }}
          SNAPSHOT_FAILURES: ${{ steps.report.outputs.snapshot_failures }}
          ACCESSIBILITY_FAILURES: ${{ steps.report.outputs.accessibility_failures }}
          RECORD_SNAPSHOTS: ${{ inputs.record_snapshots }}
          ACCESSIBILITY_MODE: ${{ inputs.accessibility_audit }}
        run: |
          set -euo pipefail
          if [ "$BUILT" != true ]; then echo '::error::Build failed; see the test report and xcodebuild.log'; exit 1; fi
          tests=${TEST_FAILURES:-0}; snapshots=${SNAPSHOT_FAILURES:-0}; audits=${ACCESSIBILITY_FAILURES:-0}
          blocking=$tests
          if [ "$RECORD_SNAPSHOTS" = true ]; then
            echo "::notice::Snapshot recording run: $snapshots snapshot(s) re-recorded; commit them from recorded-snapshots-${{ github.run_number }}"
          else
            blocking=$(( blocking + snapshots ))
          fi
          if [ "$ACCESSIBILITY_MODE" = fail ]; then
            blocking=$(( blocking + audits ))
          elif [ "$audits" -gt 0 ]; then
            echo "::warning::$audits accessibility audit failure(s); warning only"
          fi
          if [ "$blocking" -gt 0 ]; then echo "::error::$blocking blocking test failure(s); see the test report"; exit 1; fi
          # A non-zero exit with nothing attributed (runner crash, bundle failed to load) is still a failure.
          if [ "${EXIT_CODE:-1}" != 0 ] && [ $(( tests + snapshots + audits )) -eq 0 ]; then
            echo "::error::xcodebuild test exited with $EXIT_CODE without reporting a test failure; see xcodebuild.log"; exit 1
          fi
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: SwiftLint and SwiftFormat (only when the App repository has their config)
        env:
          WORKDIR: ${{ inputs.workdir }}
        run: |
          set -euo pipefail
          config_dir() { for dir in "$WORKDIR" .; do if [ -f "$dir/$1" ]; then echo "$dir"; return; fi; done; }
          lint_dir=$(config_dir .swiftlint.yml); format_dir=$(config_dir .swiftformat)
          if [ -z "$lint_dir" ] && [ -z "$format_dir" ]; then
            echo '::notice::No .swiftlint.yml or .swiftformat found; static checks skipped'; exit 0
          fi
          status=0
          if [ -n "$lint_dir" ]; then
            curl -fLsS https://github.com/realm/SwiftLint/releases/download/0.65.1/swiftlint_linux_amd64.zip -o "$RUNNER_TEMP/swiftlint.zip"
            echo "caeed6f4a679c35539ffaf124f6c4ab4a8416917f7d8796279dc52b74026059d  $RUNNER_TEMP/swiftlint.zip" | sha256sum -c -
            unzip -oq "$RUNNER_TEMP/swiftlint.zip" swiftlint-static -d "$RUNNER_TEMP"
            (cd "$lint_dir" && "$RUNNER_TEMP/swiftlint-static" lint --reporter github-actions-logging) || status=1
          fi
          if [ -n "$format_dir" ]; then
            curl -fLsS https://github.com/nicklockwood/SwiftFormat/releases/download/0.63.0/swiftformat_linux.zip -o "$RUNNER_TEMP/swiftformat.zip"
            echo "b4a3cbb8c852a0baaf9adf853e221ff1dabf921a3d8957a602e0bda3af8470f1  $RUNNER_TEMP/swiftformat.zip" | sha256sum -c -
            unzip -oq "$RUNNER_TEMP/swiftformat.zip" -d "$RUNNER_TEMP"
            chmod +x "$RUNNER_TEMP/swiftformat_linux"
            (cd "$format_dir" && "$RUNNER_TEMP/swiftformat_linux" --lint --reporter github-actions-log .) || status=1
          fi
          exit "$status"
