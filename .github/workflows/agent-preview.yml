name: Reusable Agent Preview

on:
  workflow_call:
    inputs:
      workdir:
        type: string
        required: true
      project:
        type: string
        required: true
      scheme:
        type: string
        required: true
      bundle_id:
        type: string
        required: true
      sync_command:
        type: string
        required: true
      generate_command:
        type: string
        required: true
      simulator_name:
        type: string
        default: iPhone 17 Pro
      ios_runtime:
        type: string
        default: '26'
      live_preview:
        type: boolean
        default: false
      preview_minutes:
        type: number
        default: 12
      ci_revision:
        type: string
        required: true
      screenshot_scheme:
        type: string
        default: ''
      capture_screenshots:
        type: boolean
        default: false
      screenshot_device:
        type: string
        default: iPhone 17 Pro Max
    secrets:
      AGENT_PREVIEW_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 65
    defaults:
      run:
        working-directory: ${{ inputs.workdir }}
        shell: bash
    env:
      PROJECT: ${{ inputs.project }}
      SCHEME: ${{ inputs.scheme }}
      BUNDLE_ID: ${{ inputs.bundle_id }}
      REQUESTED_DEVICE: ${{ inputs.simulator_name }}
      REQUESTED_RUNTIME: ${{ inputs.ios_runtime }}
      DERIVED_DATA: ${{ github.workspace }}/.agent-preview-derived-data
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'
      - name: Check toolchain and install project generator
        run: |
          xcodebuild -version
          if [[ "${{ inputs.generate_command }}" == *xcodegen* ]]; then brew install xcodegen; fi
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.agent-preview-derived-data/SourcePackages
          key: swift-packages-${{ runner.os }}-xcode26.6-${{ hashFiles('**/Package.resolved', '**/project.yml') }}
          restore-keys: swift-packages-${{ runner.os }}-xcode26.6-
      - name: Sync icon and generate project
        env:
          SYNC_COMMAND: ${{ inputs.sync_command }}
          GENERATE_COMMAND: ${{ inputs.generate_command }}
        run: |
          set -euo pipefail
          bash -e -c "$SYNC_COMMAND"
          bash -e -c "$GENERATE_COMMAND"
      - name: Select an installed iOS Simulator
        id: sim
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, sys
          items=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','--json']))['devices']
          found=[]
          for runtime, devices in items.items():
              if 'iOS' not in runtime or os.environ['REQUESTED_RUNTIME'] not in runtime: continue
              for d in devices:
                  if d['name'].startswith('iPhone'): found.append((runtime,d))
          if not found: sys.exit('Requested iOS runtime not installed: '+os.environ['REQUESTED_RUNTIME'])
          exact=[d for _,d in found if d['name']==os.environ['REQUESTED_DEVICE']]
          device=exact[0] if exact else sorted((d for _,d in found),key=lambda x:x['name'])[-1]
          if not exact: print('Requested model unavailable; fallback: '+device['name'])
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('udid='+device['udid']+'\nname='+device['name']+'\n')
          print('Selected '+device['name']+' ('+device['udid']+')')
          PY
      - name: Boot selected Simulator
        run: |
          xcrun simctl boot "${{ steps.sim.outputs.udid }}"
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b
      - name: Build and run tests without signing
        env:
          NSUnbufferedIO: YES
        run: |
          set -euo pipefail
          mkdir -p build/agent-preview
          xcodebuild test -project "$PROJECT" -scheme "$SCHEME" -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$DERIVED_DATA" -resultBundlePath build/agent-preview/Test.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/agent-preview/xcodebuild.log
      - name: Install, launch and capture evidence
        if: success()
        run: |
          set -euo pipefail
          APP="$DERIVED_DATA/Build/Products/Debug-iphonesimulator/${SCHEME}.app"
          test -f "$APP/Assets.car"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = "$BUNDLE_ID"
          xcrun simctl install "${{ steps.sim.outputs.udid }}" "$APP"
          xcrun simctl launch "${{ steps.sim.outputs.udid }}" "$BUNDLE_ID"
          sleep 4
          xcrun simctl io "${{ steps.sim.outputs.udid }}" screenshot build/agent-preview/launch.png
          xcrun simctl spawn "${{ steps.sim.outputs.udid }}" log show --last 2m --style compact \
            --predicate "process == '${SCHEME}'" > build/agent-preview/app.log 2>&1 || true
      - name: Capture accessibility tree with XcodeBuildMCP
        if: success()
        continue-on-error: true
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            npx --yes xcodebuildmcp@2.7.0 ui-automation snapshot-ui \
              --simulator-id "${{ steps.sim.outputs.udid }}" --output json \
              > build/agent-preview/ui-tree.json || true
            if python3 - <<'PY'
          import json
          try:
              with open('build/agent-preview/ui-tree.json') as artifact:
                  snapshot = json.load(artifact)
              assert not snapshot.get('didError')
              assert snapshot.get('data', {}).get('summary', {}).get('status') != 'FAILED'
          except (ValueError, OSError, AssertionError):
              raise SystemExit(1)
          PY
            then
              echo 'Accessibility hierarchy captured.'
              exit 0
            fi
            if grep -q 'No translation object returned for simulator' build/agent-preview/ui-tree.json; then
              # AXe can lose its host bridge on iOS 26; launchd restarts this process.
              pkill -9 -f '/usr/libexec/CoreSimulatorBridge' || true
            fi
            sleep 5
          done
          echo '::warning::XcodeBuildMCP could not capture the Simulator accessibility hierarchy; inspect ui-tree.json in the artifact.'
          exit 1
      - name: Start authenticated browser session
        if: ${{ success() && inputs.live_preview && github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@v4
        with:
          repository: wenjinliuu/ios-ci-workflows
          ref: ${{ inputs.ci_revision }}
          path: .ci-workflows
          persist-credentials: false
      - name: Run authenticated browser session
        if: ${{ success() && inputs.live_preview && github.event_name == 'workflow_dispatch' }}
        env:
          PREVIEW_PASSWORD: ${{ secrets.AGENT_PREVIEW_PASSWORD }}
          PREVIEW_MINS: ${{ inputs.preview_minutes }}
        run: |
          set -euo pipefail
          test -n "$PREVIEW_PASSWORD" || { echo 'Set AGENT_PREVIEW_PASSWORD in this App repository before enabling live preview'; exit 1; }
          test "$PREVIEW_MINS" -ge 1 && test "$PREVIEW_MINS" -le 20
          uname -m | grep -q arm64
          npm install --prefix "$RUNNER_TEMP/agent-preview-tools" --no-save --no-audit --no-fund \
            serve-sim@0.1.46 http-proxy@1.18.1 ws@8.21.0
          SIM_TOOLS="$RUNNER_TEMP/agent-preview-tools/node_modules"
          "$SIM_TOOLS/.bin/serve-sim" "${{ steps.sim.outputs.name }}" --host 127.0.0.1 --port 3200 \
            > build/agent-preview/serve-sim.log 2>&1 &
          echo $! > build/agent-preview/serve-sim.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:3200/ >/dev/null && break || sleep 2; done
          curl -fsS http://127.0.0.1:3200/ >/dev/null
          cp "$GITHUB_WORKSPACE/.ci-workflows/scripts/preview-proxy.cjs" "$RUNNER_TEMP/preview-proxy.cjs"
          NODE_PATH="$SIM_TOOLS" PREVIEW_PASSWORD="$PREVIEW_PASSWORD" \
            SIM_UDID="${{ steps.sim.outputs.udid }}" APP_SCHEME="$SCHEME" \
            SERVE_SIM_BIN="$SIM_TOOLS/.bin/serve-sim" node "$RUNNER_TEMP/preview-proxy.cjs" \
            > build/agent-preview/proxy.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3210/ >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3210/ >/dev/null
          python3 - <<'PY'
          import os, time, urllib.error, urllib.parse, urllib.request
          base = 'http://127.0.0.1:3210'
          data = urllib.parse.urlencode({'password': os.environ['PREVIEW_PASSWORD']}).encode()
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, msg, headers, newurl):
                  return None
          opener = urllib.request.build_opener(NoRedirect)
          try:
              opener.open(urllib.request.Request(base + '/login', data=data), timeout=10)
          except urllib.error.HTTPError as response:
              assert response.code == 303, response.code
              cookie = response.headers['Set-Cookie'].split(';')[0]
          assert cookie.startswith('preview_session=')
          def get(path):
              return urllib.request.urlopen(urllib.request.Request(base + path, headers={'Cookie': cookie}), timeout=15)
          with get('/') as response:
              assert b'iOS Agent Preview' in response.read()
          try:
              get('/exec-ws')
              raise AssertionError('Shell-capable endpoint is public')
          except urllib.error.HTTPError as response:
              assert response.code == 404, response.code
          for attempt in range(3):
              try:
                  with get('/helper/stream.mjpeg?raw=1') as response:
                      assert response.status == 200
                      # serve-sim prefixes even raw JPEG frames with a MIME frame header.
                      assert b'\xff\xd8' in response.read(4096), 'No JPEG frame received'
                  break
              except (OSError, AssertionError):
                  if attempt == 2: raise
                  time.sleep(3)
          print('Preview authentication, shell isolation and simulator frame verified')
          PY
          curl -fLsS https://github.com/cloudflare/cloudflared/releases/download/2026.9.3/cloudflared-darwin-arm64.tgz \
            -o "$RUNNER_TEMP/cloudflared.tgz"
          echo '587c2cfb1c230fe36c7fa7727da78be459dae028cabe8c001291999350f07095  '"$RUNNER_TEMP/cloudflared.tgz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/cloudflared.tgz" -C "$RUNNER_TEMP" cloudflared
          "$RUNNER_TEMP/cloudflared" tunnel --no-autoupdate --url http://127.0.0.1:3210 \
            > build/agent-preview/tunnel.log 2>&1 &
          for i in {1..40}; do
            URL=$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' build/agent-preview/tunnel.log | head -1 || true)
            if [ -n "$URL" ]; then break; fi
            sleep 2
          done
          test -n "$URL"
          PUBLIC_READY=false
          for attempt in 1 2 3; do
            if PREVIEW_URL="$URL" NODE_PATH="$SIM_TOOLS" \
              node "$GITHUB_WORKSPACE/.ci-workflows/scripts/check-public-preview.cjs"; then
              PUBLIC_READY=true
              break
            fi
            sleep 4
          done
          test "$PUBLIC_READY" = true
          echo "### Authenticated Agent Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "Open: $URL (password: repository secret AGENT_PREVIEW_PASSWORD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Expires when this job ends, within $PREVIEW_MINS minutes." >> "$GITHUB_STEP_SUMMARY"
          sleep "$((PREVIEW_MINS*60))"
      - name: Upload screenshot, UI tree, test result and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-preview-${{ github.run_number }}
          path: ${{ inputs.workdir }}/build/agent-preview
          if-no-files-found: warn
          retention-days: 7
      - name: Upload XCTest result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-preview-xcresult-${{ github.run_number }}
          path: ${{ inputs.workdir }}/build/agent-preview/Test.xcresult
          if-no-files-found: ignore
          retention-days: 7
  screenshots:
    if: ${{ inputs.capture_screenshots && inputs.screenshot_scheme != '' && github.event_name == 'workflow_dispatch' }}
    runs-on: macos-26
    timeout-minutes: 50
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ${{ inputs.workdir }}
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'
      - name: Sync and generate project
        env:
          SYNC_COMMAND: ${{ inputs.sync_command }}
          GENERATE_COMMAND: ${{ inputs.generate_command }}
        run: |
          set -euo pipefail
          if [[ "$GENERATE_COMMAND" == *xcodegen* ]]; then brew install xcodegen; fi
          bash -e -c "$SYNC_COMMAND"
          bash -e -c "$GENERATE_COMMAND"
      - name: Run screenshot UI tests
        env:
          SCREENSHOT_SCHEME: ${{ inputs.screenshot_scheme }}
          SIM_NAME: ${{ inputs.screenshot_device }}
          PROJECT: ${{ inputs.project }}
        run: |
          set -euo pipefail
          mkdir -p build/screenshots
          xcodebuild test -project "$PROJECT" -scheme "$SCREENSHOT_SCHEME" \
            -configuration Debug -destination "platform=iOS Simulator,name=$SIM_NAME" \
            -resultBundlePath build/Screenshots.xcresult CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/screenshots-test.log
      - name: Export screenshots
        if: always()
        run: |
          mkdir -p build/screenshots
          if [ -d build/Screenshots.xcresult ]; then
            xcrun xcresulttool export attachments --path build/Screenshots.xcresult \
              --output-path build/screenshots
          fi
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_number }}
          path: ${{ inputs.workdir }}/build/screenshots
          if-no-files-found: warn
      - name: Publish screenshots to ci/screenshots
        if: success()
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "$(ls -A "$GITHUB_WORKSPACE/${{ inputs.workdir }}/build/screenshots" 2>/dev/null)" ]; then exit 0; fi
          mkdir publish && cd publish
          cp -R "$GITHUB_WORKSPACE/${{ inputs.workdir }}/build/screenshots/." .
          git init -q
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "Screenshots from run $GITHUB_RUN_NUMBER ($GITHUB_SHA)"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/ci/screenshots
