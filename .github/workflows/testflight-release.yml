name: Reusable TestFlight Release

# 发出去的一定是测过的：verify（核对 Apple 注册）→ test（完整跑一次 Build & Test）→ release（签名上传）
# → acceptance（开发版验收 Issue）。App 的设置读自 App 仓库的 .ios-ci.yml 的顶层键和 testflight 段。
on:
  workflow_call:
    inputs:
      config:
        description: Path of the App repository's config file
        type: string
        default: .ios-ci.yml
      lookup_only: {type: boolean, default: false}
      dry_run: {type: boolean, default: false}
      build_number: {type: string, default: ''}
      marketing_version: {type: string, default: ''}
    secrets:
      APP_RUNTIME_API_KEY: {required: false}
      APPLE_TEAM_ID: {required: true}
      APP_STORE_CONNECT_KEY_ID: {required: true}
      APP_STORE_CONNECT_ISSUER_ID: {required: true}
      APP_STORE_CONNECT_PRIVATE_KEY: {required: true}

# No workflow-level permissions: every job pins contents: read except acceptance, which inherits the
# caller's token, so only callers that turn on testflight.acceptance_issue grant issues: write.
jobs:
  config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      config: ${{ steps.read.outputs.config }}
    steps:
      - name: Locate ios-ci-workflows
        run: |
          test -n "${{ job.workflow_repository }}" && test -n "${{ job.workflow_sha }}" || {
            echo '::error::This runner does not report job.workflow_repository / job.workflow_sha'; exit 1; }
          echo "ios-ci-workflows ${{ job.workflow_repository }}@${{ job.workflow_sha }}"
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ${{ inputs.config }}
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-workflows
          persist-credentials: false
      - id: read
        env:
          CONFIG_PATH: ${{ inputs.config }}
        run: python3 .ci-workflows/scripts/ios-ci-config.py

  verify:
    needs: config
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      icloud: ${{ steps.check.outputs.icloud }}
    env:
      KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      EXPECTED_BUNDLE_ID: ${{ fromJSON(needs.config.outputs.config).bundle_id }}
      ICLOUD_CONTAINER: ${{ fromJSON(needs.config.outputs.config).testflight.icloud_container }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - name: Verify App Store Connect registration
        id: check
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          pip install --quiet 'pyjwt[crypto]==2.10.1'
          if [ "${{ inputs.lookup_only }}" = true ]; then unset EXPECTED_BUNDLE_ID; fi
          python3 scripts/asc-verify.py
      - name: Clean up API key
        if: always()
        run: rm -f ~/.appstoreconnect/private_keys/AuthKey_*.p8
  test:
    # 测试门槛：把 Build & Test 完整跑一次，全部通过才签名上传。
    needs: [config, verify]
    if: ${{ always() && !cancelled() && !inputs.lookup_only && needs.config.result == 'success' && (needs.verify.result == 'success' || needs.verify.result == 'skipped') }}
    permissions:
      contents: read
    uses: ./.github/workflows/build-test.yml
    with:
      config: ${{ inputs.config }}
  release:
    needs: [config, verify, test]
    if: >-
      ${{ always() && !cancelled() && !inputs.lookup_only && needs.test.result == 'success'
      && (needs.verify.result == 'success' || needs.verify.result == 'skipped') }}
    runs-on: macos-26
    timeout-minutes: 55
    permissions:
      contents: read
    outputs:
      version: ${{ steps.archived.outputs.version }}
      number: ${{ steps.version.outputs.number }}
    defaults:
      run:
        working-directory: ${{ fromJSON(needs.config.outputs.config).workdir }}
        shell: bash
    env:
      PROJECT: ${{ fromJSON(needs.config.outputs.config).project }}
      SCHEME: ${{ fromJSON(needs.config.outputs.config).scheme }}
      EXPECTED_BUNDLE_ID: ${{ fromJSON(needs.config.outputs.config).bundle_id }}
      EXPECTED_DISPLAY_NAME: ${{ fromJSON(needs.config.outputs.config).display_name }}
      EXPECTED_TEAM_ID: ${{ fromJSON(needs.config.outputs.config).testflight.expected_team_id }}
      ENTITLEMENTS_PATH: ${{ fromJSON(needs.config.outputs.config).testflight.entitlements_path }}
      ENTITLEMENT_MODE: ${{ fromJSON(needs.config.outputs.config).testflight.entitlement_mode }}
      ICLOUD_CONTAINER: ${{ fromJSON(needs.config.outputs.config).testflight.icloud_container }}
      ENABLE_ICLOUD: ${{ needs.verify.outputs.icloud }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch ios-ci-workflows
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-workflows
          persist-credentials: false
      - name: Prepare Xcode and project
        env:
          APP_RUNTIME_API_KEY: ${{ secrets.APP_RUNTIME_API_KEY }}
        uses: ./.ci-workflows/.github/actions/prepare
        with:
          config: ${{ needs.config.outputs.config }}
          development_team: ${{ secrets.APPLE_TEAM_ID }}
      - name: Install App Store Connect API key
        if: ${{ !inputs.dry_run }}
        env:
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$TEAM_ID" && test -n "$KEY_ID" && test -n "$ISSUER_ID" && test -n "$PRIVATE_KEY"
          if [ -n "$EXPECTED_TEAM_ID" ]; then test "$TEAM_ID" = "$EXPECTED_TEAM_ID"; fi
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
      - name: Resolve version numbers
        id: version
        env:
          REQUESTED_NUMBER: ${{ inputs.build_number }}
          REQUESTED_VERSION: ${{ inputs.marketing_version }}
        run: |
          NUMBER=${REQUESTED_NUMBER:-$GITHUB_RUN_NUMBER}
          [[ "$NUMBER" =~ ^[0-9]+$ ]] || exit 1
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
          if [ -n "$REQUESTED_VERSION" ]; then
            [[ "$REQUESTED_VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]] || exit 1
          fi
      - name: Archive unsigned
        env:
          REQUESTED_VERSION: ${{ inputs.marketing_version }}
          BUILD_NUMBER: ${{ steps.version.outputs.number }}
        run: |
          set -euo pipefail
          mkdir -p build
          flags=("CURRENT_PROJECT_VERSION=$BUILD_NUMBER")
          if [ -n "$REQUESTED_VERSION" ]; then flags+=("MARKETING_VERSION=$REQUESTED_VERSION"); fi
          xcodebuild archive -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "build/${SCHEME}.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM="$TEAM_ID" "${flags[@]}" \
            2>&1 | tee build/release-archive.log
      - name: Verify archived app and embedded icon
        id: archived
        run: |
          set -euo pipefail
          APP_PATH=$(find "build/${SCHEME}.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' -type d -print -quit)
          test -n "$APP_PATH" && test -f "$APP_PATH/Assets.car"
          find "$APP_PATH" -maxdepth 1 -type f -name 'AppIcon*.png' -print -quit | grep -q .
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")" = "$EXPECTED_BUNDLE_ID"
          if [ -n "$EXPECTED_DISPLAY_NAME" ]; then
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP_PATH/Info.plist")" = "$EXPECTED_DISPLAY_NAME"
          fi
          echo "version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")" >> "$GITHUB_OUTPUT"
      - name: Embed entitlements into unsigned archive
        if: ${{ !inputs.dry_run && fromJSON(needs.config.outputs.config).testflight.entitlement_mode != 'none' }}
        continue-on-error: ${{ fromJSON(needs.config.outputs.config).testflight.entitlement_mode == 'best-effort' }}
        run: |
          set -euo pipefail
          if [ "$ENTITLEMENT_MODE" = "icloud-verified" ] && [ "$ENABLE_ICLOUD" != true ]; then exit 0; fi
          APP_PATH=$(find "build/${SCHEME}.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' -type d -print -quit)
          test -f "$ENTITLEMENTS_PATH"
          if [ -n "$ICLOUD_CONTAINER" ]; then grep -q "$ICLOUD_CONTAINER" "$ENTITLEMENTS_PATH"; fi
          codesign --force --sign - --entitlements "$ENTITLEMENTS_PATH" --generate-entitlement-der "$APP_PATH"
      - name: Write export options
        if: ${{ !inputs.dry_run }}
        run: |
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>teamID</key><string>${TEAM_ID}</string>
          <key>signingStyle</key><string>automatic</string>
          <key>uploadSymbols</key><true/>
          <key>destination</key><string>upload</string>
          </dict></plist>
          PLIST
      - name: Export, sign and upload to TestFlight
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          xcodebuild -exportArchive -archivePath "build/${SCHEME}.xcarchive" \
            -exportOptionsPlist build/ExportOptions.plist -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" \
            2>&1 | tee build/release-export.log
      - name: Inspect exported iCloud entitlements (informational)
        if: ${{ always() && fromJSON(needs.config.outputs.config).testflight.inspect_icloud && !inputs.dry_run }}
        continue-on-error: true
        run: |
          set +e
          cat > build/ExportOptionsLocal.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>teamID</key><string>${TEAM_ID}</string>
          <key>signingStyle</key><string>automatic</string>
          <key>uploadSymbols</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "build/${SCHEME}.xcarchive" \
            -exportOptionsPlist build/ExportOptionsLocal.plist -exportPath build/inspect \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" \
            > build/inspect-export.log 2>&1 || exit 0
          IPA=$(find build/inspect -maxdepth 2 -name '*.ipa' -print -quit)
          test -n "$IPA" || exit 0
          mkdir -p build/unzipped
          unzip -q "$IPA" -d build/unzipped
          APP=$(find build/unzipped/Payload -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP" || exit 0
          codesign -d --entitlements :- --xml "$APP" 2>/dev/null \
            | plutil -convert xml1 -o - - | tee build/entitlements.txt
          security cms -D -i "$APP/embedded.mobileprovision" 2>/dev/null \
            | plutil -extract Entitlements xml1 -o - - | tee build/profile-entitlements.txt
          if grep -q 'ubiquity-container-identifiers' build/entitlements.txt; then
            echo 'Binary has iCloud ubiquity entitlement'
          else
            echo 'Binary has no iCloud ubiquity entitlement'
          fi
      - name: Upload entitlement report
        if: ${{ always() && fromJSON(needs.config.outputs.config).testflight.inspect_icloud }}
        uses: actions/upload-artifact@v4
        with:
          name: entitlements-${{ steps.version.outputs.number }}
          path: |
            ${{ fromJSON(needs.config.outputs.config).workdir }}/build/entitlements.txt
            ${{ fromJSON(needs.config.outputs.config).workdir }}/build/profile-entitlements.txt
          if-no-files-found: ignore
      - name: Upload dSYMs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ fromJSON(needs.config.outputs.config).testflight.artifact_prefix }}dsyms-${{ steps.version.outputs.number }}
          path: ${{ fromJSON(needs.config.outputs.config).workdir }}/build/${{ fromJSON(needs.config.outputs.config).scheme }}.xcarchive/dSYMs
          if-no-files-found: ignore
      - name: Clean up API key
        if: always()
        run: rm -f ~/.appstoreconnect/private_keys/AuthKey_*.p8
  acceptance:
    # Opens a device checklist issue for the build that was just uploaded.
    needs: [config, release]
    if: ${{ fromJSON(needs.config.outputs.config).testflight.acceptance_issue && !inputs.dry_run && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Open release acceptance issue
        env:
          GH_TOKEN: ${{ github.token }}
          APP_NAME: ${{ fromJSON(needs.config.outputs.config).display_name || fromJSON(needs.config.outputs.config).scheme }}
          VERSION: ${{ needs.release.outputs.version }}
          NUMBER: ${{ needs.release.outputs.number }}
          CHECKLIST: ${{ fromJSON(needs.config.outputs.config).testflight.acceptance_checklist }}
          EXTRA: ${{ fromJSON(needs.config.outputs.config).testflight.acceptance_extra }}
        run: |
          set -euo pipefail
          section() { if [ -s "$1" ]; then cat "$1"; else echo "$2"; fi; }
          {
            echo "TestFlight 已上传 **$APP_NAME $VERSION ($NUMBER)**，提交 $GITHUB_SHA。"
            echo
            echo "装上这个 build 后在真机上逐项检查：通过就打勾，有问题在下面评论（可以配截图）。AI 下次会读这个 Issue 修问题。"
            echo
            echo "## 固定项"
            echo
            section "$CHECKLIST" "（仓库里还没有 \`$CHECKLIST\`）"
            echo
            echo "## 本次项"
            echo
            section "$EXTRA" "（本次没有额外项；AI 可以把针对这次改动的检查项写进 \`$EXTRA\`）"
          } > "$RUNNER_TEMP/acceptance.md"
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "$APP_NAME $VERSION ($NUMBER) 发版验收" --body-file "$RUNNER_TEMP/acceptance.md" || {
            echo "::error::Cannot open the acceptance issue; grant 'issues: write' in the caller workflow"; exit 1; }
