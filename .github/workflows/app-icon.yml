name: Reusable App Icon

on:
  workflow_call:
    inputs:
      workdir: {type: string, required: true}
      project: {type: string, required: true}
      scheme: {type: string, required: true}
      icon_path: {type: string, required: true}
      sync_command: {type: string, required: true}
      generate_command: {type: string, required: true}
      commit_previews: {type: boolean, default: false}
      previews_dir: {type: string, default: DesignAssets/AppIcon/previews}

# No workflow-level permissions: both checks pin contents: read, while the optional publish-previews job
# inherits the caller's token, so only callers that turn commit_previews on grant contents: write.
jobs:
  native-validation:
    runs-on: macos-26
    timeout-minutes: 40
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.workdir }}
        shell: bash
    env:
      PROJECT: ${{ inputs.project }}
      SCHEME: ${{ inputs.scheme }}
      ICON_PATH: ${{ inputs.icon_path }}
      SYNC_COMMAND: ${{ inputs.sync_command }}
      GENERATE_COMMAND: ${{ inputs.generate_command }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'
      - name: Generate project and sync icon
        run: |
          set -euo pipefail
          if [[ "$GENERATE_COMMAND" == *xcodegen* ]]; then brew install xcodegen; fi
          bash -e -c "$SYNC_COMMAND"
          bash -e -c "$GENERATE_COMMAND"
          test -f "$ICON_PATH/icon.json"
      - name: Validate icon in unsigned archive
        run: |
          set -euo pipefail
          mkdir -p build/app-icon
          xcodebuild archive -project "$PROJECT" -scheme "$SCHEME" \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "build/app-icon/${SCHEME}.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            2>&1 | tee build/app-icon/native-build.log
          APP_PATH=$(find "build/app-icon/${SCHEME}.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' -type d -print -quit)
          test -n "$APP_PATH" && test -f "$APP_PATH/Assets.car"
          find "$APP_PATH" -maxdepth 1 -type f -name 'AppIcon*.png' -print -quit | grep -q .
          if grep -Eiq 'app icon.*(conflict|error)|failed to generate flattened icon' build/app-icon/native-build.log; then exit 1; fi
  preview:
    runs-on: macos-26
    timeout-minutes: 25
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.workdir }}
        shell: bash
    env:
      ICON_PATH: ${{ inputs.icon_path }}
      SYNC_COMMAND: ${{ inputs.sync_command }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Render optional icon previews
        continue-on-error: true
        run: |
          bash -e -c "$SYNC_COMMAND"
          mkdir -p build/app-icon
          cp -R "$ICON_PATH" build/app-icon/AppIcon.icon
          npx -y -p icon-composer-mcp@1.1.0 icon-composer inspect "$ICON_PATH"
          for rendition in Default Dark TintedLight TintedDark ClearLight ClearDark; do
            npx -y -p icon-composer-mcp@1.1.0 icon-composer render "$ICON_PATH" \
              "build/app-icon/${rendition}.png" --platform iOS --rendition "$rendition" --width 1024 --height 1024 || true
          done
          npx -y -p icon-composer-mcp@1.1.0 icon-composer export-marketing \
            "$ICON_PATH" build/app-icon/Marketing-1024.png --size 1024 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-icon-${{ github.sha }}
          path: ${{ inputs.workdir }}/build/app-icon
          if-no-files-found: warn
  publish-previews:
    # Commits the renditions back so the repository shows them; pushes made with the job token
    # do not start new workflow runs, so this cannot loop.
    needs: preview
    if: ${{ inputs.commit_previews && github.event_name == 'push' && github.ref_type == 'branch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: app-icon-${{ github.sha }}
          path: ${{ runner.temp }}/app-icon
      - name: Write previews and README
        env:
          PREVIEWS_DIR: ${{ inputs.previews_dir }}
        run: |
          set -euo pipefail
          mkdir -p "$PREVIEWS_DIR"
          labels=(Default:默认 Dark:深色 TintedLight:着色·浅 TintedDark:着色·深 ClearLight:透明·浅 ClearDark:透明·深 Marketing-1024:市场图)
          {
            echo '# App 图标预览'
            echo
            echo "同一个图标在 iOS 各种外观模式下的渲染效果，外加 1 张 1024 市场图。由 CI 自动生成，请勿手改。"
            echo
            header='|'; divider='|'; images='|'
            for pair in "${labels[@]}"; do
              name=${pair%%:*}; label=${pair#*:}
              if [ -f "$RUNNER_TEMP/app-icon/$name.png" ]; then
                cp "$RUNNER_TEMP/app-icon/$name.png" "$PREVIEWS_DIR/$name.png"
                header+=" $label |"; divider+=' --- |'; images+=" <img src=\"$name.png\" width=\"120\"> |"
              fi
            done
            printf '%s\n%s\n%s\n' "$header" "$divider" "$images"
          } > "$PREVIEWS_DIR/README.md"
      - name: Commit previews
        env:
          PREVIEWS_DIR: ${{ inputs.previews_dir }}
        run: |
          set -euo pipefail
          git add -A "$PREVIEWS_DIR"
          if git diff --cached --quiet; then echo 'Previews unchanged'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m "Update app icon previews for ${GITHUB_SHA:0:7}"
          git pull -q --rebase origin "$GITHUB_REF_NAME"
          git push -q origin "HEAD:$GITHUB_REF_NAME" || {
            echo "::error::Cannot push previews; grant 'contents: write' in the caller workflow"; exit 1; }
